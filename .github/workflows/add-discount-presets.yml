name: Add discount presets
on:
  push:
    paths:
      - '.github/workflows/add-discount-presets.yml'
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch discount presets
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('app/new-order-v2.tsx')
          s = p.read_text()
          old = "const [customerDiscount, setCustomerDiscount] = useState<'無折扣' | '9折' | '85折' | '自訂'>('無折扣')"
          new = "const [customerDiscount, setCustomerDiscount] = useState<'無折扣' | '95折' | '9折' | '85折' | '8折' | '自訂'>('無折扣')"
          if old not in s: raise SystemExit('state type not found')
          s = s.replace(old, new)

          old = "const customerDiscountRate = customerDiscount === '9折' ? 0.9 : customerDiscount === '85折' ? 0.85 : customerDiscount === '自訂' ? Math.max(0, Math.min(1, Number(customDiscountPct || 100) / 100)) : 1"
          new = "const customerDiscountRate = customerDiscount === '95折' ? 0.95 : customerDiscount === '9折' ? 0.9 : customerDiscount === '85折' ? 0.85 : customerDiscount === '8折' ? 0.8 : customerDiscount === '自訂' ? Math.max(0, Math.min(1, Number(customDiscountPct || 100) / 100)) : 1"
          if old not in s: raise SystemExit('rate mapping not found')
          s = s.replace(old, new)

          old = "options={['無折扣', '9折', '85折', '自訂']}"
          new = "options={['無折扣', '95折', '9折', '85折', '8折', '自訂']}"
          if old not in s: raise SystemExit('discount options not found')
          s = s.replace(old, new)

          old = "setCustomerDiscount(value as '無折扣' | '9折' | '85折' | '自訂')"
          new = "setCustomerDiscount(value as '無折扣' | '95折' | '9折' | '85折' | '8折' | '自訂')"
          if old not in s: raise SystemExit('discount cast not found')
          s = s.replace(old, new)
          p.write_text(s)
          PY
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app/new-order-v2.tsx
          git commit -m "Add 95 and 80 percent discount presets" || exit 0
          git push